[project]
name = "autotinker-backend"
version = "0.1.0"
description = "AutoTinker's API: sessions, runs (local process or Vercel Sandbox), event streaming and link previews."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "vercel>=0.11.6",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
  "uvicorn>=0.30",
]

[tool.vercel]
entrypoint = "main:app"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["autotinker_api/urlguard.py"]  # a verbatim copy of the engine's file (see tests/test_urlguard_copy.py)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105", "SIM108", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["autotinker_api"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["autotinker_api", "main.py", "migrate.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
