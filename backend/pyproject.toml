[project]
name = "autotinker-spike-backend"
version = "0.0.1"
description = "SPIKE: FastAPI backend that runs AutoTinker in a Vercel Sandbox and relays its events."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "vercel>=0.11.6",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.30"]

[tool.vercel]
entrypoint = "main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
