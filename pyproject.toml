[project]
name = "autotabml"
version = "0.1.0.dev0"
description = "A self-improving agent for tabular ML: evolves readable pipelines in a sandbox until it hits the problem's ceiling."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sakalya Mitra" }]
keywords = ["automl", "agents", "llm", "tabular", "machine-learning", "autoresearch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "pydantic>=2.8",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.3", "xgboost>=2.1"]
openml = ["openml>=0.15"]
kaggle = ["kagglehub>=0.3"]
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]

[project.scripts]
autotabml = "autotabml.cli:app"

[project.urls]
Homepage = "https://github.com/Sakalya100/AutoTabML"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotabml"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]  # str-mixin enums keep pydantic JSON values stable

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/autotabml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
