[project]
name = "autotinker"
version = "0.2.0"
description = "A self-improving agent for tabular ML: evolves readable pipelines in a sandbox until it hits the problem's ceiling."
readme = "README.pypi.md"  # generated from README.md by tools/readme_assets.py (PyPI has no mermaid)
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sakalya Mitra" }]
keywords = ["automl", "agents", "llm", "tabular", "machine-learning", "scikit-learn", "autoresearch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "pydantic>=2.8,<3",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
  "optuna>=5.0.0",
  "autoevals>=0.3.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.3", "xgboost>=2.1", "catboost>=1.2"]
parquet = ["pyarrow>=15"]
openml = ["openml>=0.15"]
kaggle = ["kagglehub>=0.3"]
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]

[project.scripts]
autotinker = "autotinker.cli:main"

[project.urls]
Homepage = "https://autotinker.sakalya.si"
Source = "https://github.com/Sakalya100/AutoTinker"
Issues = "https://github.com/Sakalya100/AutoTinker/issues"
Roadmap = "https://github.com/Sakalya100/AutoTinker/blob/main/docs/ROADMAP.md"
Changelog = "https://github.com/Sakalya100/AutoTinker/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotinker"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.sdist]
# Only the engine package (pyproject.toml, README.md and LICENSE are always added). No tests, benchmarks,
# web/, backend/, docs/, runs/ or schema/.
only-include = ["src/autotinker"]
exclude = ["__pycache__", "*.pyc"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]  # str-mixin enums keep pydantic JSON values stable

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/autotinker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
